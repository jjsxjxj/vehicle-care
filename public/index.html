<title>车辆保养助手</title>
<script>
/* 必须在样式表之前跑：先定主题再渲染，避免首屏闪白/闪黑。 */
(function () {
  var LIGHT = '#f3f5f9', DARK = '#0a1929';
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function resolve() {
    var saved = null;
    try { saved = localStorage.getItem('vc_theme'); } catch (e) {}
    if (saved === 'light' || saved === 'dark') return saved;
    return mq.matches ? 'dark' : 'light';
  }
  function apply() {
    var t = resolve();
    document.documentElement.setAttribute('data-theme', t);
    var m = document.getElementById('themeColor');
    if (m) m.setAttribute('content', t === 'dark' ? DARK : LIGHT);
  }
  window.__vcApplyTheme = apply;
  apply();
  try { mq.addEventListener('change', apply); } catch (e) { mq.addListener(apply); }
})();
</script>
